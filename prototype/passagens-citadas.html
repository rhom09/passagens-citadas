<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passagens citadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F4;--surf:#FFFFFF;--ink:#15202B;--mut:#566673;--acc:#A86A00;--line:#D3DCE2;--on:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101C24;--surf:#182A35;--ink:#E9F0F3;--mut:#93A8B6;--acc:#F2B84B;--line:#28404F;--on:#101C24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101C24;--surf:#182A35;--ink:#E9F0F3;--mut:#93A8B6;--acc:#F2B84B;--line:#28404F;--on:#101C24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Public Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 40px}
h1{font:700 24px/1.2 Literata,Georgia,serif;margin:0}
h2{font:600 15px/1.3 "Public Sans",system-ui,sans-serif;color:var(--mut);margin:28px 0 4px}
#status{margin:4px 0 16px;color:var(--mut);font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut);margin-right:8px}
.live .dot{background:#D1432F;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{width:100%;min-height:56px;border:0;border-radius:8px;background:var(--acc);color:var(--on);font-weight:600;font-size:18px}
#msg{color:#C0392B;min-height:0;margin:10px 0 0;font-size:15px}
.now{background:var(--surf);border-left:6px solid var(--acc);border-radius:6px;padding:22px 20px;min-height:160px;display:flex;align-items:center;margin:16px 0 10px}
.ref{font:700 clamp(36px,12vw,68px)/1.05 Literata,Georgia,serif;overflow-wrap:anywhere}
.empty{color:var(--mut)}
.tx{color:var(--mut);font-size:15px;margin:0;min-height:46px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
ul{list-style:none;margin:0;padding:0}
li button{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:500 20px/1.3 Literata,Georgia,serif;padding:13px 4px}
details{margin-top:28px;color:var(--mut)}
summary{cursor:pointer;padding:6px 0}
.test{display:flex;gap:8px;margin-top:8px}
.test input{flex:1;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink)}
.test button{padding:0 16px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Passagens citadas</h1>
  <p id="status"><span class="dot"></span><span id="st">Parado</span></p>
  <button id="btn" class="go">Começar a escutar</button>
  <p id="msg" role="status"></p>
  <section class="now" aria-live="polite"><div id="cur" class="empty">Toque em “Começar a escutar” e deixe o celular perto de quem está pregando.</div></section>
  <p id="tx" class="tx"></p>
  <h2>Anteriores</h2>
  <ul id="hist"></ul>
  <details>
    <summary>Testar sem microfone</summary>
    <div class="test"><input id="ti" placeholder="Ex.: abram em João capítulo 3 versículo 16"><button id="tb">Detectar</button></div>
  </details>
</main>
<script>
const BOOKS=[['Gênesis','genesis',50],['Êxodo','exodo',40],['Levítico','levitico',27],['Números','numeros',36],['Deuteronômio','deuteronomio',34],['Josué','josue',24],['Juízes','juizes',21],['Rute','rute',4],['Samuel','samuel',[31,24]],['Reis','reis',[22,25]],['Crônicas','cronicas',[29,36]],['Esdras','esdras',10],['Neemias','neemias',13],['Ester','ester',10],['Jó','jo,job',42],['Salmos','salmos,salmo',150],['Provérbios','proverbios',31],['Eclesiastes','eclesiastes',12],['Cantares de Salomão','cantares de salomao,cantares,canticos',8],['Isaías','isaias',66],['Jeremias','jeremias',52],['Lamentações','lamentacoes',5],['Ezequiel','ezequiel',48],['Daniel','daniel',12],['Oseias','oseias,oseas',14],['Joel','joel',3],['Amós','amos',9],['Obadias','obadias',1],['Jonas','jonas',4],['Miqueias','miqueias',7],['Naum','naum',3],['Habacuque','habacuque,habacuc',3],['Sofonias','sofonias',3],['Ageu','ageu',2],['Zacarias','zacarias',14],['Malaquias','malaquias',4],['Mateus','mateus',28],['Marcos','marcos',16],['Lucas','lucas',24],['João','joao',21],['Atos','atos,atos dos apostolos',28],['Romanos','romanos',16],['Coríntios','corintios',[16,13]],['Gálatas','galatas',6],['Efésios','efesios',6],['Filipenses','filipenses',4],['Colossenses','colossenses',4],['Tessalonicenses','tessalonicenses',[5,3]],['Timóteo','timoteo',[6,4]],['Tito','tito',3],['Filemom','filemom,filemon',1],['Hebreus','hebreus',13],['Tiago','tiago',5],['Pedro','pedro',[5,3]],['João','joao',[5,1,1]],['Judas','judas',1],['Apocalipse','apocalipse',22]];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const map={};
for(const[d,al,ch]of BOOKS)for(const a of al.split(',')){const e=(map[a]??={});if(Array.isArray(ch))e.num=[d,ch];else e.plain=[d,ch]}
const roots=Object.keys(map).sort((a,b)=>b.length-a.length).join('|');
const RE=new RegExp('(?:\\b(primeir[oa]|segund[oa]|terceir[oa]|1|2|3)\\s+(?:carta\\s+)?(?:(?:de|do|dos|aos|ao|a)\\s+)?)?\\b('+roots+')\\b(?:\\s+(?:de\\s+)?(?:capitulo|cap))?\\s+(\\d{1,3})(?:\\s+(?:versiculos?\\s+|vers\\s+|v\\s+)?(\\d{1,3})(?:\\s+(?:ao|ate|a|e)\\s+(?:versiculo\\s+)?(\\d{1,3}))?)?','g');
const U={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9};
const T={dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19};
const D={vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90};
const H={cem:100,cento:100,duzentos:200,trezentos:300};
const isN=w=>w in U||w in T||w in D||w in H;
function numWords(s){
  const t=s.split(' '),o=[];
  for(let i=0;i<t.length;){
    if(!isN(t[i])){o.push(t[i++]);continue}
    let tot=0,st=0,j=i;
    while(j<t.length){
      let w=t[j],skip=0;
      if(w==='e'&&st>0&&st<3&&j+1<t.length&&isN(t[j+1])){w=t[j+1];skip=1}
      let v,ns;
      if(w in H&&st===0){v=H[w];ns=1}
      else if(w in D&&st<=1){v=D[w];ns=2}
      else if(w in T&&st<=1){v=T[w];ns=3}
      else if(w in U&&st<=2){v=U[w];ns=3}
      else break;
      tot+=v;st=ns;j+=1+skip;
    }
    o.push(String(tot));i=j;
  }
  return o.join(' ');
}
function detect(raw){
  let s=norm(raw).replace(/(\d)\s*[:,.]\s*(?=\d)/g,'$1 versiculo ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  s=numWords(s);
  const out=[];let m;RE.lastIndex=0;
  while((m=RE.exec(s))){
    const[,pf,root,c0,v0,v20]=m,e=map[root];
    const n=pf?(/^(1|primeir)/.test(pf)?1:/^(2|segund)/.test(pf)?2:3):0;
    let book,max;
    if(n&&e.num&&e.num[1][n-1]!==undefined){book=n+' '+e.num[0];max=e.num[1][n-1]}
    else if(e.plain){book=e.plain[0];max=e.plain[1]}
    else continue;
    let c=+c0,v=v0?+v0:0,v2=v20?+v20:0;
    if(max===1&&!v){v=c;c=1}
    if(c<1||c>max)continue;
    if(v2&&v2<=v)v2=0;
    out.push(book+' '+c+(v?':'+v:'')+(v2?'-'+v2:''));
  }
  return out;
}
const $=id=>document.getElementById(id);
let items=[],active=false,session=0,rec,wake;
function render(){
  const cur=$('cur');
  if(items.length){cur.className='ref';cur.textContent=items[0].r}
  else{cur.className='empty';cur.textContent='Toque em “Começar a escutar” e deixe o celular perto de quem está pregando.'}
  $('hist').innerHTML=items.slice(1,12).map((x,i)=>'<li><button data-i="'+(i+1)+'">'+x.r+'</button></li>').join('');
  $('btn').textContent=active?'Parar de escutar':'Começar a escutar';
  $('st').textContent=active?'Escutando':'Parado';
  $('status').className=active?'live':'';
}
function update(key,text){
  const refs=detect(text);
  items=items.filter(x=>x.key!==key);
  for(const r of refs){if(items[0]&&items[0].r===r)continue;items.unshift({key,r})}
  items=items.slice(0,30);
  render();
}
function showTx(t){$('tx').textContent=t.length>140?'…'+t.slice(-140):t}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(active&&document.visibilityState==='visible')lock()});
function start(){
  $('msg').textContent='';
  if(!SR){$('msg').textContent='Este navegador não tem reconhecimento de voz. Abra esta página no Chrome.';return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      showTx(t);update(session+'-'+i,t);
    }
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      active=false;$('msg').textContent='O microfone está bloqueado. Libere o acesso nas permissões do navegador e tente de novo.';render();
    }
  };
  rec.onend=()=>{if(active){session++;try{rec.start()}catch(e){}}};
  active=true;session++;
  try{rec.start()}catch(e){}
  lock();render();
}
function stop(){active=false;try{rec.stop()}catch(e){}try{wake&&wake.release()}catch(e){}render()}
$('btn').onclick=()=>active?stop():start();
$('hist').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const [x]=items.splice(+b.dataset.i,1);items.unshift(x);render();
};
function test(){const v=$('ti').value.trim();if(!v)return;showTx(v);update('t'+Date.now(),v);$('ti').value=''}
$('tb').onclick=test;
$('ti').onkeydown=e=>{if(e.key==='Enter')test()};
render();
</script>
</body>
</html>
